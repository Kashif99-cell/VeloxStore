<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloxStore | Minecraft Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
        header {
            background-color: #1e293b;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            color: #f59e0b;
            font-size: 30px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
        .nav-links {
            margin-top: 10px;
        }
        .nav-links a {
            color: #38bdf8;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            padding: 30px 0;
        }
        .hero h2 {
            font-size: 30px;
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .hero p {
            color: #cbd5e1;
            margin-bottom: 15px;
        }
        .section-title {
            color: #f59e0b;
            text-align: center;
            margin: 30px 0 15px 0;
            font-size: 24px;
            <body>

    <!-- Header / Navbar -->
    <header>
        <div class="brand">
            <h1>ChaosPhageSMP</h1>
        </div>
        <div class="nav-right">
            <button onclick="openLoginModal()" class="login-btn">➡️ Login</button>
        </div>
    </header>

    <div class="container">
        <!-- Hero Section -->
        <div class="hero">
            <h2>Welcome to ChaosPhageSMP</h2>
            <p>Official Minecraft Server Store</p>
        </div>

        <!-- Banners Category (From Video) -->
        <div class="category-banners">
            <div class="cat-card">RANKS</div>
            <div class="cat-card economy">ECONOMY</div>
        </div>

        <!-- RANKS SECTION -->
        <h2 class="section-heading">👑 SERVER RANKS</h2>
        <div class="grid-container">
            <div class="card">
                <h3>VIP RANK</h3>
                <p>Special VIP privileges</p>
                <div class="price">Rs. 200</div>
                <button onclick="openBuyModal('VIP Rank')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>VIP+ RANK</h3>
                <p>Advanced VIP perks</p>
                <div class="price">Rs. 400</div>
                <button onclick="openBuyModal('VIP+ Rank')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>MVP RANK</h3>
                <p>Exclusive MVP privileges</p>
                <div class="price">Rs. 700</div>
                <button onclick="openBuyModal('MVP Rank')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>MVP+ RANK</h3>
                <p>Premium perks & features</p>
                <div class="price">Rs. 1200</div>
                <button onclick="openBuyModal('MVP+ Rank')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>LEGEND RANK</h3>
                <p>Ultimate server rank</p>
                <div class="price">Rs. 2500</div>
                <button onclick="openBuyModal('LEGEND Rank')" class="buy-btn">Buy Now</button>
            </div>
        </div>

        <!-- ECONOMY / COINS SECTION -->
        <h2 class="section-heading">🪙 ECONOMY & COINS</h2>
        <div class="grid-container">
            <div class="card">
                <h3>50 COINS</h3>
                <p>In-game coins pack</p>
                <div class="price">Rs. 250</div>
                <button onclick="openBuyModal('50 Coins')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>100 COINS</h3>
                <p>In-game coins pack</p>
                <div class="price">Rs. 500</div>
                <button onclick="openBuyModal('100 Coins')" class="buy-btn">Buy Now</button>
            </div>
            <div class="card">
                <h3>1000 COINS</h3>
                <p>In-game mega coins pack</p>
                <div class="price">Rs. 2000</div>
                <button onclick="openBuyModal('1000 Coins')" class="buy-btn">Buy Now</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 ChaosPhageSMP. All Rights Reserved.
    </footer>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Sign in to get started</h3>
            <p>Link your Discord account to manage purchases.</p>
            <a href="https://discord.gg/rSHJeK8uV" target="_blank" class="discord-btn">Login with Discord</a>
            <button onclick="closeModal('loginModal')" class="close-btn">Close</button>
        </div>
    </div>

    <!-- Buy Item Modal -->
    <div id="buyModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="buyModalTitle">Purchase Item</h3>
            <p>Order place karne ke liye Discord server join karke ticket create karein!</p>
            <a href="https://discord.gg/rSHJeK8uV" target="_blank" class="discord-btn">Join Discord Server</a>
            <button onclick="closeModal('buyModal')" class="close-btn">Close</button>
        </div>
    </div>

    <script>
        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }
        function openBuyModal(itemName) {
            document.getElementById('buyModalTitle').innerText = "Buy " + itemName;
            document.getElementById('buyModal').style.display = 'flex';
        }
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>
</body>
</html>
